version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: tronwallet
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  tronwallet:
    image: maiyude/tronmoney:v1
    cpu: 1.0
    memory: 512Mi
    storage:
      size: 1500Mi
    network:
      ingress:
        port: 8501
        public: true
