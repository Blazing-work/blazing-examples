version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: fast
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  fast:
    image: ddooo/fast
    cpu: 1.0
    memory: 512Mi
    storage:
      size: 512Mi
    network:
      ingress:
        port: 80
        public: true
