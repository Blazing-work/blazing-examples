version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: packetstream
providers:
  akash:
    status: prefer
services:
  packetstream:
    image: packetstream/psclient:latest
    cpu: 1.0
    memory: 256Mi
    storage:
      size: 8Mi
    variables:
      CID: '"REPLACE_ME"'
    network:
      ingress:
        port: 80
        public: true
