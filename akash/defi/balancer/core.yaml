version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: balancer
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  balancer:
    image: stephendefi/balancer:latest
    cpu: 0.1
    memory: 512Mi
    storage:
      size: 512Mi
    network:
      ingress:
        port: 80
        public: true
