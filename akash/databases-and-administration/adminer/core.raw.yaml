version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: adminer
providers:
  akash:
    status: prefer
services:
  adminer:
    image: adminer
    cpu: 0.1
    memory: 512Mi
    storage:
      size: 512Mi
    network:
      ingress:
        port: 8080
        public: true
