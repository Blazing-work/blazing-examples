version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: goosebin
providers:
  akash:
    status: prefer
services:
  goosebin:
    image: ghcr.io/ovrclk/goosebin:20210902b
    cpu: 0.1
    memory: 256Mi
    network:
      ingress:
        port: 8000
        public: true
  redis:
    image: redis:6.2.5
    cpu: 0.1
    memory: 256Mi
    network:
      ingress:
        port: 6379
        public: false
