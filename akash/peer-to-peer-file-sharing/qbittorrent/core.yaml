version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: qbittorrent
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  qbittorrent:
    image: ghcr.io/spacepotahto/qbittorrent:1.0.0
    cpu: 1.0
    memory: 1Gi
    storage:
      size: 2Gi
    network:
      ingress:
        port: 8080
        public: true
