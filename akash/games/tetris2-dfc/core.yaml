version: v0.2
organization_id: '{{ORG_ID}}'
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'

cluster:
  name: tetris2-dfc

providers:
  dfc:
    status: prefer

regions:
  mode: explicit
  explicit:
    - region_id: dfc-pt-lisbon
      provider: dfc
      is_primary: true

services:
  tetris:
    image: uzyexe/tetris
    cpu: 0.5
    memory: 512Mi
    storage:
      size: 512Mi
    mesh:
      enabled: false
    network:
      ingress:
        port: 80
        public: true
