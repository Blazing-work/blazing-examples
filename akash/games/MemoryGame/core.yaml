version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: MemoryGame
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  memorygame:
    image: jungpilyu/memorygame
    cpu: 1.0
    memory: 512Mi
    storage:
      size: 2Gi
    network:
      ingress:
        port: 80
        public: true
