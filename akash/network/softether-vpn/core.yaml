version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: softether-vpn
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  softether:
    image: andrey01/softether:4.38-9760-2
    cpu: 1.0
    memory: 512Mi
    storage:
      size: 512Mi
    network:
      ingress:
        port: 80
        public: true
