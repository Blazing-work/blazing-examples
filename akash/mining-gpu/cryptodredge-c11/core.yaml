version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: cryptodredge-c11
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  bminer-c11:
    image: cryptoandcoffee/akash-gpu-miner-cryptodredge-c11:2
    cpu: 0.5
    memory: 768Mi
    storage:
      size: 128Mi
    variables:
      ALGO: '"kawpow"'
      WALLET_ADDRESS: '""'
      POOL: '"stratum+ssl://kawpow.mine.zergpool.com:13638"'
      PASSWORD: '"c=DOGE,m=solo"'
      OPTIONS: '""'
    network:
      ingress:
        port: 1880
        public: true
