version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: metabase
providers:
  akash:
    status: prefer
services:
  metabase:
    image: metabase/metabase:v0.54.19.3
    cpu: 1.0
    memory: 1Gi
    storage:
      size: 2Gi
    variables:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: '5432'
      MB_DB_USER: metabase
      MB_DB_PASS: mysecretpassword
      MB_DB_HOST: postgres
    network:
      ingress:
        port: 3000
        public: true
  postgres:
    image: postgres:14.19-alpine3.21
    cpu: 1.0
    memory: 1Gi
    storage:
      size: 2Gi
    variables:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
    secrets:
    - secret_ref: postgres_password
      mode: env
      keys:
        value: POSTGRES_PASSWORD
    network:
      ingress:
        port: 5432
        public: true
