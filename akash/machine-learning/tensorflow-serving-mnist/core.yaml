version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: tensorflow-serving-mnist
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  web:
    image: wlouie1/mnist-tf-serve:1.0
    cpu: 0.2
    memory: 512Mi
    storage:
      size: 512Mi
    network:
      ingress:
        port: 8501
        public: true
