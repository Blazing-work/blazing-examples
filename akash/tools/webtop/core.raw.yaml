version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: webtop
providers:
  akash:
    status: prefer
services:
  webtop:
    image: lscr.io/linuxserver/webtop:latest
    cpu: 2.0
    memory: 4Gi
    storage:
      size: 50Gi
    variables:
      PUID: '1000'
      PGID: '1000'
      TZ: Etc/UTC
      SUBFOLDER: /
      KEYBOARD: en-us-qwerty
      TITLE: Webtop
    network:
      ingress:
        port: 3000
        public: true
