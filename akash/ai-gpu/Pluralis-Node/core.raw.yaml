version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: Pluralis-Node
providers:
  akash:
    status: prefer
services:
  pluralis:
    image: >-
      zjuuu/pluralis:latest@sha256:fdf0f7b348fdf5289f7547a1a0c7edd3c7bc8d7d7056da8ac062056bbabb8187
    cpu: 12.0
    memory: 64Gi
    storage:
      size: 80Gi
    variables:
      PERSISTENT_FOLDER: /persistent
    network:
      ingress:
        port: 49200
        public: true
