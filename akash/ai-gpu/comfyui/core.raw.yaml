version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: comfyui
providers:
  akash:
    status: prefer
services:
  app:
    image: zjuuu/comfyui:0.23
    cpu: 6.0
    memory: 35Gi
    storage:
      size: 50Gi
    variables:
      ENABLE_MANAGER: 'true'
      VAEURLS: ''
      MODELURLS: ''
      UPSCALEURLS: ''
      COMMANDLINE_ARGS: --listen 0.0.0.0 --port 8080
      DELETE_EVERY_12HRS: 'true'
    network:
      ingress:
        port: 8080
        public: true
