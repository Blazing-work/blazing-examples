version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: kawpow-pool-meowcoin
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  kawpow-pool:
    image: cryptoandcoffee/akash-kawpow-pool:9
    cpu: 2.0
    memory: 4Gi
    storage:
      size: 8Gi
    variables:
      RAVEN_ENABLE: 'false'
      NEOXA_ENABLE: 'false'
      MEOWCOIN_ENABLE: 'true'
      WALLET: ''
      FEE_WALLET: ''
      FEE_AMOUNT: '0.1'
      DAEMON_HOST: meowcoin
      DAEMON_PORT: '9766'
      DAEMON_USER: user1
      DAEMON_PASS: pass1
    network:
      ingress:
        port: 8788
        public: true
  meowcoin:
    image: cryptoandcoffee/akash-meowcoin:3
    cpu: 2.0
    memory: 4Gi
    storage:
      size: 10Gi
    secrets:
    - secret_ref: private_key
      mode: env
      keys:
        value: PRIVATE_KEY
    network:
      ingress:
        port: 9766
        public: false
