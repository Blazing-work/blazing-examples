version: v0.2
project_id: '{{PROJECT_ID}}'
cluster_id: '{{CLUSTER_ID}}'
cluster:
  name: lunie-lite
providers:
  dcf:
    status: prefer
  akash:
    status: fallback
services:
  lunielight:
    image: ovrclk/lunie-light
    cpu: 1.0
    memory: 512Mi
    storage:
      size: 512Mi
    network:
      ingress:
        port: 3000
        public: true
